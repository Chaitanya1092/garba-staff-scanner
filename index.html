<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garba Night 2026 - Staff Scanner</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:20px;color:#222}
.container{max-width:560px;margin:auto;background:#fff;padding:22px;border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.14)}
h1{text-align:center;margin:0 0 5px}.subtitle{text-align:center;color:#666;margin-bottom:18px}
input{width:100%;padding:13px;border:1px solid #ccc;border-radius:9px;font-size:16px;margin-bottom:8px}
button{padding:12px 18px;margin:5px 3px;border:0;border-radius:9px;background:#222;color:#fff;font-size:15px}
button.secondary{background:#666}
#reader{width:100%;margin-top:14px}
#result{margin-top:18px;padding:16px;border-radius:12px;font-size:17px;font-weight:bold;text-align:center}
.success{background:#d4edda;color:#155724}.error{background:#f8d7da;color:#721c24}.info{background:#fff3cd;color:#856404}
.hidden{display:none!important}
.dashboard{margin-top:22px}.dashboard-title{text-align:center;font-size:20px;font-weight:bold;margin-bottom:12px}
.overall{background:#f7f1df;border:1px solid #d6b75b;border-radius:14px;padding:14px;margin-bottom:14px;text-align:center}
.overall-number{font-size:34px;font-weight:bold;color:#7f1232}.overall-label{font-size:13px;color:#555}
.day-card{border:1px solid #ddd;border-radius:13px;margin-bottom:12px;overflow:hidden;background:#fff}
.day-header{background:#7f1232;color:#fff;padding:11px 14px;font-weight:bold;text-align:center}
.counter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.counter{background:#f7f7f7;border-radius:10px;padding:10px;text-align:center}
.counter strong{display:block;font-size:24px;color:#7f1232}.counter span{font-size:12px;color:#555}
.day-total{padding:11px;border-top:1px solid #ddd;text-align:center;font-weight:bold}
.updated{text-align:center;font-size:11px;color:#777;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<h1>🎟️ Garba Night 2026</h1>
<div class="subtitle">Staff Entry Verification</div>

<div id="loginPanel">
<input type="password" id="pin" placeholder="Enter Staff PIN" autocomplete="off">
<button onclick="authenticateStaff()">🔐 Unlock Staff Scanner</button>
<div id="loginMessage" class="hidden"></div>
</div>

<div id="staffPanel" class="hidden">
<button onclick="startScanner()">📷 Start Scanner</button>
<button class="secondary" onclick="loadStats()">📊 Refresh Counter</button>

<div id="reader"></div>
<div id="result" class="hidden"></div>

<button id="nextBtn" class="hidden" onclick="scanNext()">🔄 Scan Next</button>

<div class="dashboard">
<div class="dashboard-title">📊 Entry Counter</div>
<div class="overall">
<div class="overall-number" id="overallTotal">0</div>
<div class="overall-label">OVERALL TOTAL — DAY 1 + DAY 2 + DAY 3</div>

<div class="counter-grid" style="margin-top:12px">
<div class="counter"><strong id="overallFirst">0</strong><span>1st Year — 3 Days</span></div>
<div class="counter"><strong id="overallSecond">0</strong><span>2nd Year — 3 Days</span></div>
<div class="counter"><strong id="overallThird">0</strong><span>3rd Year — 3 Days</span></div>
<div class="counter"><strong id="overallFourth">0</strong><span>4th Year — 3 Days</span></div>
</div>
</div>
<div id="statsContainer"></div>
<div class="updated" id="updated">Enter PIN and tap Refresh Counter</div>
</div>
</div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbzG_6RjBkjjH8Rv8xbwXNjFZDXIvLE5inmnTWy4rA7RiV7XwNbNYoCzuE6BklR9GC7Z/exec";
let scanner=null,scanning=false;
let staffAuthenticated=false;

function showLoginMessage(message,type){
 const r=document.getElementById("loginMessage");
 r.className="";r.classList.add(type);r.innerHTML=message;
}

function authenticateStaff(){
 const pin=document.getElementById("pin").value.trim();
 if(!pin){
  showLoginMessage("⚠️ Please enter the Staff PIN.","error");
  return;
 }

 showLoginMessage("⏳ Verifying Staff PIN...","info");
 const cb="garbaAuthCallback_"+Date.now();
 window[cb]=function(data){
  try{
   delete window[cb];
   if(data.success){
    staffAuthenticated=true;
    document.getElementById("loginPanel").classList.add("hidden");
    document.getElementById("staffPanel").classList.remove("hidden");
    showResult("🔓 ACCESS GRANTED<br><br>Staff scanner unlocked.","success");
    loadStats();
   }else{
    staffAuthenticated=false;
    showLoginMessage("🚫 ACCESS DENIED<br><br>Wrong Staff PIN. Scanner will not start.","error");
    document.getElementById("pin").value="";
    document.getElementById("pin").focus();
   }
  }catch(e){
   staffAuthenticated=false;
   showLoginMessage("❌ Could not verify Staff PIN.","error");
  }
 };
 const s=document.createElement("script");
 s.src=API_URL+"?action=auth&pin="+encodeURIComponent(pin)+"&callback="+cb;
 s.onerror=function(){delete window[cb];staffAuthenticated=false;showLoginMessage("❌ Could not connect to access server.","error")};
 document.body.appendChild(s);
}

function showResult(message,type){
 const r=document.getElementById("result");
 r.className="";r.classList.add(type);r.innerHTML=message;
}
function extractPassID(text){
 text=text.trim();
 try{const u=new URL(text);const p=u.searchParams.get("pass");if(p)return p}catch(e){}
 return text;
}
function startScanner(){
 if(!staffAuthenticated){
  showLoginMessage("🚫 ACCESS DENIED<br><br>Enter the correct Staff PIN to unlock the scanner.","error");
  return;
 }
 const pin=document.getElementById("pin").value.trim();
 if(!pin){staffAuthenticated=false;document.getElementById("staffPanel").classList.add("hidden");document.getElementById("loginPanel").classList.remove("hidden");showLoginMessage("🚫 ACCESS DENIED","error");return}
 if(scanning)return;
 scanning=true;
 document.getElementById("result").classList.add("hidden");
 document.getElementById("nextBtn").classList.add("hidden");
 scanner=new Html5Qrcode("reader");
 scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:250}},onScanSuccess,()=>{})
 .catch(()=>{scanning=false;showResult("❌ Camera could not start.<br><br>Please allow camera permission and try again.","error")});
}
async function onScanSuccess(decodedText){
 if(!staffAuthenticated){return;}
 if(!scanning)return;
 scanning=false;
 try{await scanner.stop()}catch(e){}
 const passID=extractPassID(decodedText);
 const pin=document.getElementById("pin").value.trim();
 showResult("⏳ Checking pass "+passID+"...","info");
 verifyPass(passID,pin);
}
function verifyPass(passID,pin){
 if(!staffAuthenticated){showResult("🚫 ACCESS DENIED","error");return;}
 const cb="garbaCallback_"+Date.now();
 window[cb]=function(data){
  try{
   delete window[cb];
   if(data.success){
    showResult("✅ ENTRY APPROVED<br><br>Pass ID: "+data.passID+"<br>Name: "+data.name+"<br>Valid: "+data.validDates,"success");
    loadStats();
   }else{
    let m=data.message||"Pass verification failed.";
    if(data.name)m+="<br><br>Name: "+data.name;
    if(data.validDates)m+="<br>Valid: "+data.validDates;
    showResult(m,"error");
   }
   document.getElementById("nextBtn").classList.remove("hidden");
  }catch(e){showResult("❌ Verification error.","error")}
 };
 const s=document.createElement("script");
 s.src=API_URL+"?action=verify&pass="+encodeURIComponent(passID)+"&pin="+encodeURIComponent(pin)+"&callback="+cb;
 s.onerror=function(){delete window[cb];showResult("❌ Could not connect to verification server.","error");document.getElementById("nextBtn").classList.remove("hidden")};
 document.body.appendChild(s);
}
function scanNext(){
 document.getElementById("result").classList.add("hidden");
 document.getElementById("nextBtn").classList.add("hidden");
 startScanner();
}
function loadStats(){
 if(!staffAuthenticated){document.getElementById("updated").textContent="Access denied. Unlock scanner with the correct Staff PIN.";return;}
 const pin=document.getElementById("pin").value.trim();
 if(!pin){document.getElementById("updated").textContent="Staff authentication required.";return}
 const cb="garbaStatsCallback_"+Date.now();
 window[cb]=function(data){
  try{delete window[cb];if(!data.success){document.getElementById("updated").textContent=data.message||"Could not load statistics.";return}renderStats(data)}
  catch(e){document.getElementById("updated").textContent="❌ Error loading statistics."}
 };
 const s=document.createElement("script");
 s.src=API_URL+"?action=stats&pin="+encodeURIComponent(pin)+"&callback="+cb;
 s.onerror=function(){delete window[cb];document.getElementById("updated").textContent="❌ Could not connect to statistics server."};
 document.body.appendChild(s);
}
function renderStats(data){
 document.getElementById("overallTotal").textContent=data.overall.Total;
 document.getElementById("overallFirst").textContent=data.overall["First Year"];
 document.getElementById("overallSecond").textContent=data.overall["Second Year"];
 document.getElementById("overallThird").textContent=data.overall["Third Year"];
 document.getElementById("overallFourth").textContent=data.overall["Fourth Year"];

 const c=document.getElementById("statsContainer");c.innerHTML="";
 data.eventDates.forEach(function(date,index){
  const s=data.stats[date],card=document.createElement("div");card.className="day-card";
  card.innerHTML=
   '<div class="day-header">DAY '+(index+1)+' — '+date+'</div>'+
   '<div class="day-total" style="font-size:22px;background:#f7f1df">DAY '+(index+1)+' TOTAL: '+s.Total+'</div>'+
   '<div class="counter-grid">'+
   '<div class="counter"><strong>'+s["First Year"]+'</strong><span>1st Year</span></div>'+
   '<div class="counter"><strong>'+s["Second Year"]+'</strong><span>2nd Year</span></div>'+
   '<div class="counter"><strong>'+s["Third Year"]+'</strong><span>3rd Year</span></div>'+
   '<div class="counter"><strong>'+s["Fourth Year"]+'</strong><span>4th Year</span></div>'+
   '</div>';
  c.appendChild(card);
 });
 document.getElementById("updated").textContent="Last updated: "+data.generatedAt;
}
</script>
</body>
</html>
